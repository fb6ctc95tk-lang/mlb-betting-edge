name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
  ORACLE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
  PYTHONPATH: "."

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Oracle source fingerprints
        run: |
          echo "a71d7b6aa8b75db83638ded5b2f2431cd81fde969f2a42dda11a22d8f7dd0cf4  backend/oracle/adapter_interface.py" | sha256sum --check
          echo "86ada9410b282d8760c8581f29b87cc5a77ad6a6a491a3be6301ed65e686656b  backend/oracle/sport_policy_store.py" | sha256sum --check
          echo "8a3c4f9177b070a2b2ba9ce9960536232dcddc6ffd2645e1fc8b8fc184bd76cd  backend/oracle/consumer_admin_interface.py" | sha256sum --check
          echo "a2b39dccf6a373f8428ce0d8a3f8fee0d297eedcfaec6e302fc98c5a18781c3f  backend/oracle/event_store.py" | sha256sum --check

      - name: Apply database schema and migrations
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          # Deterministic discovery: apply every numbered migration in lexical
          # (== numeric) filename order. Any newly committed migration is applied
          # automatically; omission is impossible and any error fails the job.
          for migration in $(ls database/migrations/*.sql | sort); do
            echo "Applying migration: $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run tests
        run: python -m pytest backend/tests/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint
